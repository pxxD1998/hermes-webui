name: Apply PR 6713 resize anchor fix

on:
  push:
    branches:
      - automation/pr-6713-resize-anchor-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/project-picker-viewport
          fetch-depth: 0

      - name: Apply resize-anchor fix and regression coverage
        shell: python
        run: |
          from pathlib import Path

          sessions_path = Path("static/sessions.js")
          sessions = sessions_path.read_text(encoding="utf-8")
          old = """  let top=rect.bottom+gap;
          if(pickerH<=spaceBelow){
            // Preferred placement: directly below the session action button.
          }else if(pickerH<=spaceAbove){
            top=rect.top-gap-pickerH;
          }else{
            // Neither side fits the natural height. Use the roomier side and keep every
            // project reachable by scrolling inside the picker.
            const openAbove=spaceAbove>spaceBelow;
            const available=openAbove?spaceAbove:spaceBelow;
            top=openAbove?margin:rect.bottom+gap;
            picker.style.maxHeight=available+'px';
            picker.style.overflowY='auto';
          }
          picker.style.top=top+'px';
          picker.style.bottom='auto';
          """
          new = """  if(pickerH<=spaceBelow){
            // Preferred placement: directly below the session action button.
            picker.style.top=(rect.bottom+gap)+'px';
            picker.style.bottom='auto';
          }else if(pickerH<=spaceAbove){
            // Keep above-positioned pickers bottom-anchored so they stay attached when
            // the viewport height changes and the session row moves with it.
            picker.style.top='auto';
            picker.style.bottom=(window.innerHeight-rect.top+gap)+'px';
          }else{
            // Neither side fits the natural height. Use the roomier side and keep every
            // project reachable by scrolling inside the picker.
            const openAbove=spaceAbove>spaceBelow;
            const available=openAbove?spaceAbove:spaceBelow;
            picker.style.top=(openAbove?margin:rect.bottom+gap)+'px';
            picker.style.bottom='auto';
            picker.style.maxHeight=available+'px';
            picker.style.overflowY='auto';
          }
          """
          assert old in sessions, "expected project-picker placement block not found"
          sessions_path.write_text(sessions.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_project_picker_viewport_position.py")
          test = test_path.read_text(encoding="utf-8")
          old_driver = """  const style = mountedPicker.style;
          const top = Number.parseFloat(style.top);
          const maxHeight = style.maxHeight && style.maxHeight !== 'none'
            ? Number.parseFloat(style.maxHeight)
            : null;
          const renderedHeight = maxHeight === null ? pickerHeight : Math.min(pickerHeight, maxHeight);
          return {
            top,
            maxHeight,
            overflowY: style.overflowY || '',
            renderedBottom: top + renderedHeight,
          };
          """
          new_driver = """  const style = mountedPicker.style;
          const maxHeight = style.maxHeight && style.maxHeight !== 'none'
            ? Number.parseFloat(style.maxHeight)
            : null;
          const renderedHeight = maxHeight === null ? pickerHeight : Math.min(pickerHeight, maxHeight);
          const topStyle = style.top || '';
          const bottomStyle = style.bottom || '';
          const top = topStyle && topStyle !== 'auto'
            ? Number.parseFloat(topStyle)
            : window.innerHeight - Number.parseFloat(bottomStyle) - renderedHeight;
          const resizeDelta = 200;
          const resizedTop = topStyle === 'auto'
            ? (window.innerHeight + resizeDelta) - Number.parseFloat(bottomStyle) - renderedHeight
            : top;
          const resizedAnchorTop = rect.top + resizeDelta;
          return {
            top,
            topStyle,
            bottomStyle,
            resizeGap: resizedAnchorTop - (resizedTop + renderedHeight),
            maxHeight,
            overflowY: style.overflowY || '',
            renderedBottom: top + renderedHeight,
          };
          """
          assert old_driver in test, "expected test driver block not found"
          test = test.replace(old_driver, new_driver, 1)

          old_assert = """    assert screenshot_like[\"renderedBottom\"] <= 892
          """
          new_assert = """    assert screenshot_like[\"renderedBottom\"] <= 892
              assert screenshot_like[\"topStyle\"] == \"auto\"
              assert screenshot_like[\"bottomStyle\"] == \"224px\"
              assert screenshot_like[\"resizeGap\"] == 4
          """
          # Normalize the intended Python indentation explicitly.
          new_assert = new_assert.replace("              assert", "    assert")
          assert old_assert in test, "expected screenshot assertion not found"
          test_path.write_text(test.replace(old_assert, new_assert, 1), encoding="utf-8")

      - name: Run targeted checks
        run: |
          python -m pytest -q tests/test_project_picker_viewport_position.py
          node --check static/sessions.js
          git diff --check

      - name: Commit and push PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/sessions.js tests/test_project_picker_viewport_position.py
          git commit -m "fix(sessions): keep above picker anchored on resize"
          git push origin HEAD:fix/project-picker-viewport
