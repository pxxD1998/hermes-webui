name: Apply PR 6713 resize anchor fix

on:
  push:
    branches:
      - automation/pr-6713-resize-anchor-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/project-picker-viewport
          fetch-depth: 0

      - name: Apply resize-anchor fix and regression coverage
        shell: python
        run: |
          from pathlib import Path
          import re

          sessions_path = Path("static/sessions.js")
          sessions = sessions_path.read_text(encoding="utf-8")

          above_pattern = re.compile(
              r"}else if\(pickerH<=spaceAbove\)\{\s*"
              r"top=rect\.top-gap-pickerH;"
          )
          above_replacement = "\n".join([
              "}else if(pickerH<=spaceAbove){",
              "    // Keep above-positioned pickers bottom-anchored so they stay attached across resize.",
              "    top=null;",
              "    picker.style.bottom=(window.innerHeight-rect.top+gap)+'px';",
          ])
          sessions, count = above_pattern.subn(above_replacement, sessions, count=1)
          assert count == 1, f"fits-above branch patch count: {count}"

          final_pattern = re.compile(
              r"(?m)^  picker\.style\.top=top\+'px';\n"
              r"  picker\.style\.bottom='auto';$"
          )
          final_replacement = "\n".join([
              "  if(top===null){",
              "    picker.style.top='auto';",
              "  }else{",
              "    picker.style.top=top+'px';",
              "    picker.style.bottom='auto';",
              "  }",
          ])
          sessions, count = final_pattern.subn(final_replacement, sessions, count=1)
          assert count == 1, f"final positioning patch count: {count}"
          sessions_path.write_text(sessions, encoding="utf-8")

          test_path = Path("tests/test_project_picker_viewport_position.py")
          test = test_path.read_text(encoding="utf-8")
          driver_pattern = re.compile(
              r"  const style = mountedPicker\.style;\n"
              r"  const top = Number\.parseFloat\(style\.top\);\n"
              r"  const maxHeight = style\.maxHeight && style\.maxHeight !== 'none'\n"
              r"    \? Number\.parseFloat\(style\.maxHeight\)\n"
              r"    : null;\n"
              r"  const renderedHeight = maxHeight === null \? pickerHeight : Math\.min\(pickerHeight, maxHeight\);\n"
              r"  return \{\n"
              r"    top,\n"
              r"    maxHeight,\n"
              r"    overflowY: style\.overflowY \|\| '',\n"
              r"    renderedBottom: top \+ renderedHeight,\n"
              r"  \};"
          )
          driver_replacement = "\n".join([
              "  const style = mountedPicker.style;",
              "  const maxHeight = style.maxHeight && style.maxHeight !== 'none'",
              "    ? Number.parseFloat(style.maxHeight)",
              "    : null;",
              "  const renderedHeight = maxHeight === null ? pickerHeight : Math.min(pickerHeight, maxHeight);",
              "  const topStyle = style.top || '';",
              "  const bottomStyle = style.bottom || '';",
              "  const top = topStyle && topStyle !== 'auto'",
              "    ? Number.parseFloat(topStyle)",
              "    : window.innerHeight - Number.parseFloat(bottomStyle) - renderedHeight;",
              "  const resizeDelta = 200;",
              "  const resizedTop = topStyle === 'auto'",
              "    ? (window.innerHeight + resizeDelta) - Number.parseFloat(bottomStyle) - renderedHeight",
              "    : top;",
              "  const resizedAnchorTop = rect.top + resizeDelta;",
              "  return {",
              "    top,",
              "    topStyle,",
              "    bottomStyle,",
              "    resizeGap: resizedAnchorTop - (resizedTop + renderedHeight),",
              "    maxHeight,",
              "    overflowY: style.overflowY || '',",
              "    renderedBottom: top + renderedHeight,",
              "  };",
          ])
          test, count = driver_pattern.subn(driver_replacement, test, count=1)
          assert count == 1, f"driver patch count: {count}"

          assertion_old = '    assert screenshot_like["renderedBottom"] <= 892\n'
          assertion_new = (
              assertion_old
              + '    assert screenshot_like["topStyle"] == "auto"\n'
              + '    assert screenshot_like["bottomStyle"] == "224px"\n'
              + '    assert screenshot_like["resizeGap"] == 4\n'
          )
          assert assertion_old in test, "screenshot assertion not found"
          test = test.replace(assertion_old, assertion_new, 1)
          test_path.write_text(test, encoding="utf-8")

      - name: Run targeted checks
        run: |
          python -m pytest -q tests/test_project_picker_viewport_position.py
          node --check static/sessions.js
          git diff --check

      - name: Commit and push PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/sessions.js tests/test_project_picker_viewport_position.py
          git commit -m "fix(sessions): keep above picker anchored on resize"
          git push origin HEAD:fix/project-picker-viewport
