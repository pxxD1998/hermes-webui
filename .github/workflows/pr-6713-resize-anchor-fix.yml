name: Apply PR 6713 resize anchor fix

on:
  push:
    branches:
      - automation/pr-6713-resize-anchor-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/project-picker-viewport
          fetch-depth: 0

      - name: Apply resize-anchor fix and regression coverage
        shell: python
        run: |
          from pathlib import Path

          sessions_path = Path("static/sessions.js")
          sessions = sessions_path.read_text(encoding="utf-8")

          above_old = """  }else if(pickerH<=spaceAbove){
            top=rect.top-gap-pickerH;
          }else{
          """
          above_new = """  }else if(pickerH<=spaceAbove){
            // Keep the existing viewport-relative bottom anchor so this picker stays
            // attached to the session row when the viewport height changes.
            top=null;
            picker.style.bottom=(window.innerHeight-rect.top+gap)+'px';
          }else{
          """
          # YAML block indentation is stripped uniformly; normalize string indentation.
          above_old = above_old.replace("          }else", "  }else").replace("            top", "    top").replace("          }else{", "  }else{")
          above_new = above_new.replace("          }else", "  }else").replace("            //", "    //").replace("            //", "    //").replace("            top", "    top").replace("            picker", "    picker").replace("          }else{", "  }else{")
          assert above_old in sessions, "fits-above branch not found"
          sessions = sessions.replace(above_old, above_new, 1)

          final_old = """  picker.style.top=top+'px';
          picker.style.bottom='auto';
          """
          final_new = """  if(top===null){
            picker.style.top='auto';
          }else{
            picker.style.top=top+'px';
            picker.style.bottom='auto';
          }
          """
          final_old = final_old.replace("          picker", "  picker")
          final_new = final_new.replace("          if", "  if").replace("            picker", "    picker").replace("          }else", "  }else").replace("          }", "  }")
          assert final_old in sessions, "final picker positioning block not found"
          sessions = sessions.replace(final_old, final_new, 1)
          sessions_path.write_text(sessions, encoding="utf-8")

          test_path = Path("tests/test_project_picker_viewport_position.py")
          test = test_path.read_text(encoding="utf-8")

          driver_old = """  const style = mountedPicker.style;
          const top = Number.parseFloat(style.top);
          const maxHeight = style.maxHeight && style.maxHeight !== 'none'
            ? Number.parseFloat(style.maxHeight)
            : null;
          const renderedHeight = maxHeight === null ? pickerHeight : Math.min(pickerHeight, maxHeight);
          return {
            top,
            maxHeight,
            overflowY: style.overflowY || '',
            renderedBottom: top + renderedHeight,
          };
          """
          driver_new = """  const style = mountedPicker.style;
          const maxHeight = style.maxHeight && style.maxHeight !== 'none'
            ? Number.parseFloat(style.maxHeight)
            : null;
          const renderedHeight = maxHeight === null ? pickerHeight : Math.min(pickerHeight, maxHeight);
          const topStyle = style.top || '';
          const bottomStyle = style.bottom || '';
          const top = topStyle && topStyle !== 'auto'
            ? Number.parseFloat(topStyle)
            : window.innerHeight - Number.parseFloat(bottomStyle) - renderedHeight;
          const resizeDelta = 200;
          const resizedTop = topStyle === 'auto'
            ? (window.innerHeight + resizeDelta) - Number.parseFloat(bottomStyle) - renderedHeight
            : top;
          const resizedAnchorTop = rect.top + resizeDelta;
          return {
            top,
            topStyle,
            bottomStyle,
            resizeGap: resizedAnchorTop - (resizedTop + renderedHeight),
            maxHeight,
            overflowY: style.overflowY || '',
            renderedBottom: top + renderedHeight,
          };
          """
          # Remove the workflow's YAML indentation from both snippets.
          driver_old = "\n".join(line[10:] if line.startswith("          ") else line for line in driver_old.splitlines()) + "\n"
          driver_new = "\n".join(line[10:] if line.startswith("          ") else line for line in driver_new.splitlines()) + "\n"
          assert driver_old in test, "test driver block not found"
          test = test.replace(driver_old, driver_new, 1)

          assertion_old = '    assert screenshot_like["renderedBottom"] <= 892\n'
          assertion_new = (
              assertion_old
              + '    assert screenshot_like["topStyle"] == "auto"\n'
              + '    assert screenshot_like["bottomStyle"] == "224px"\n'
              + '    assert screenshot_like["resizeGap"] == 4\n'
          )
          assert assertion_old in test, "screenshot assertion not found"
          test = test.replace(assertion_old, assertion_new, 1)
          test_path.write_text(test, encoding="utf-8")

      - name: Run targeted checks
        run: |
          python -m pytest -q tests/test_project_picker_viewport_position.py
          node --check static/sessions.js
          git diff --check

      - name: Commit and push PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/sessions.js tests/test_project_picker_viewport_position.py
          git commit -m "fix(sessions): keep above picker anchored on resize"
          git push origin HEAD:fix/project-picker-viewport
